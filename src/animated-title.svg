<svg width="800" height="80" viewBox="0 0 600 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@800&display=swap');

      .title {
        font-family: 'Sora', sans-serif;
        font-size: 32px;
        font-weight: 800;
        fill: url(#grad);
        animation: slideIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
      }

      @keyframes slideIn {
        0%   { opacity: 0; transform: translateX(-80px); }
        60%  { opacity: 1; }
        100% { opacity: 1; transform: translateX(0); }
      }

      .cursor {
        fill: #00e5ff;
        animation: blink 1.1s step-end 1.3s infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0; }
      }

      .glow {
        animation: glowPulse 2.8s ease-in-out 1.2s infinite alternate;
      }

      @keyframes glowPulse {
        from { filter: blur(8px) opacity(0.3); }
        to   { filter: blur(14px) opacity(0.6); }
      }

      .grad-shift {
        animation: gradMove 3.5s linear 0.2s both;
      }

      @keyframes gradMove {
        0%   { x: -600px; }
        100% { x: 0px;    }
      }
    </style>

    <!-- Gradient: white → blue → cyan -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f0f6ff" />
      <stop offset="45%"  stop-color="#1e90ff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Glow blur layer -->
    <linearGradient id="gradGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1e90ff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <clipPath id="clip">
      <rect x="0" y="0" width="600" height="80" />
    </clipPath>
  </defs>

  <!-- Background (transparent — works on dark & light) -->
  <rect width="600" height="80" fill="none" />

  <!-- Glow layer -->
  <g clip-path="url(#clip)">
    <text x="20" y="54" class="title glow"
          fill="url(#gradGlow)"
          style="filter:blur(10px); opacity:0.4;">
      👋 Hola, soy Maxim Butrimov
    </text>
  </g>

  <!-- Main text -->
  <g clip-path="url(#clip)">
    <text x="20" y="54" class="title">
      👋 Hola, soy Maxim Butrimov
    </text>
  </g>

  <!-- Blinking cursor -->
  <text x="578" y="54" class="cursor" font-size="32" font-family="monospace">|</text>
</svg>
